# Pressure-fed search; population scales with the number of unfixed variables.
base_config: Configs/flight_pressure_fed_regulator.yaml
tank_ids:
  oxidizer: ox_tank
  fuel: fuel_tank
  pressurant: press_tank
seed: 42
max_evaluations: 10000       # Total candidate evaluations, including initial population
maxiter: 117                 # Generation cap; max_evaluations separately caps total evaluations
popsize: 5
reference_mass: 180.0
hard_constraints:
  - max_length_to_diameter
  - goal_apogee
  - max_burn_duration
  - max_aoa_deg
  - min_stability_calibers
  - tank.fuel_tank.Tmin
  - tank.fuel_tank.Pmin
  - tank.ox_tank.Tmin
  - tank.ox_tank.Pmin
  - tank.press_tank.Tmin
  - tank.press_tank.Pmin
soft_penalties:
  stability_length_fraction:
    lower_target: 0.10
    upper_target: 0.20
    scale: 0.05
    weight: 0.15
  # tank_pressure_tracking:
  #   fuel_tank:
  #     pressure_scale_pa: 100000.0
  #     time_scale_s: 10.0
  #     weight: 0.05
  #   ox_tank:
  #     pressure_scale_pa: 100000.0
  #     time_scale_s: 10.0
  #     weight: 0.05
  max_q:
    target_pa: 140000.0
    scale_pa: 10000.0
    weight: 0.0
conditional_geometry: true
verification_dt_factor: 0.5
failure_policy:
  native_retries: 1
  consecutive_limit: 50
  window: 100
  rate_limit: 0.95 # Allow broad exploration with frequent aero-domain exits.
  repeated_limit: 3
evaluation_overrides:
  tanks.press_tank.mass: 29.5 # currently fixing COPV dimensions to match manufacturer's spec
  tanks.fuel_tank.min_temperature: 80.0 # arbitrarily low to stop from constraining the optimizer
  tanks.fuel_tank.min_pressure: 68947.57293168
  tanks.ox_tank.min_temperature: 80.0 # not that important, but helps avoid freezing the LOX
  tanks.ox_tank.min_pressure: 68947.57293168
  tanks.press_tank.min_pressure: 1.034e6 # 150 psia min pnuematics pressure
  tanks.press_tank.min_temperature: 140.0 # loosely determined to be acceptable based on GFSSP runs
  constraints.max_length_to_diameter: 35.0
  constraints.min_stability_calibers: 2.0
  constraints.max_aoa_deg: 15.0
  constraints.goal_apogee: 140000.0
  constraints.max_burn_duration: 75.0
  simulation.t_end: 600.0
  environment.max_altitude: 300000.0
bounds:

  exit_pressure: [41100.0, 103421.0]
  omld:
  - 0.31115 # fixed due to stock constraints
  - 0.31115
  fineness:
  - 4.0
  - 6.0
  boattail_aft:
  - 0.1905
  - 0.4064
  boattail_length:
  - 0.508
  - 0.635
  span: # m; mapped inside 0.5–1.2 times each candidate diameter
  - 0.1016
  - 0.48768
  root:
  - 0.381
  - 0.508
  tip:
  - 0.1016
  - 0.2032
  sweep_fraction:
  - 0.5
  - 1.0
  thickness:
  - 0.00635
  - 0.0127
  chamber_pressure:
  - 1400000.0
  - 3500000.0
  mixture_ratio:
  - 2.0
  - 2.3
  thrust:
  - 10000.0
  - 25000.0
  copv_pressure:
  - 21000000.0
  - 31000000.0
  copv_volume:
  - 0.055 # currently fixing COPV dimensions to match manufacturer's spec
  - 0.055
  oxidizer_mass:
  - 100.0
  - 300.0
  fuel_mass:
  - 80.0
  - 150.0
constraint_scales:
  max_length_to_diameter: 5.0 # Five L/D units = one normalized violation
  max_aoa_deg: 1.0
  goal_apogee: 10000.0
  max_burn_duration: 5.0
  max_q: 10000.0
  min_stability_calibers: 0.5
  min_rail_twr: 0.2
unit_scales:
  deg: 1.0
  m: 0.01
  Pa: 1000000.0
  K: 10.0
  s: 5.0
  kW: 5.0
  calibers: 1.0
  '1': 1.0
