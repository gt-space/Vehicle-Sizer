# Physical SI units throughout. Propulsion bounds are editable starting ranges,
# not qualified hardware limits. Unresolved runtime candidates receive class-3 scores.
base_config: Configs/flight_pump_fed_regulator.yaml
tank_ids: {oxidizer: ox_tank, fuel: fuel_tank, pressurant: press_tank}
seed: 42
max_evaluations: 200
maxiter: 100                  # Generation budget; flat failure scores do not stop the search
popsize: 4                    # Multiplier: 4 * 18 = 72 population members
reference_mass: 250.0        # kg; fixed positive mass scale, does not alter ranking
conditional_geometry: true  # map coupled dimensions inside the user bounds
verification_dt_factor: 0.5  # One extra flight of the winner, with load peaks

# Applied to a copy; the flight configs remain unchanged.
evaluation_overrides:
  simulation.t_end: 600.0
  environment.max_altitude: 300000.0

bounds:
  # Dragmodel ranges intersected with fixed packaging limits. Length and nozzle
  # exit are derived and checked against the deck for every sized candidate.
  omld: [0.22636, 0.4064] # fixed COPV diameter + airframe walls
  fineness: [4.0, 6.0]
  boattail_aft: [0.1905, 0.4064] # Also constrained by body diameter and nozzle fit
  boattail_length: [0.5715, 0.635] # engine length is the minimum
  span: [0.1016, 0.48768] # m; mapped inside 0.5–1.2 times each candidate diameter
  root: [0.381, 0.508]
  tip: [0.1016, 0.2032]
  sweep_fraction: [0.5, 1.0]
  thickness: [0.00635, 0.0127]
  chamber_pressure: [1400000.0, 3500000.0] # Pa
  mixture_ratio: [1.5, 3.0]
  thrust: [12000.0, 25000.0]                # N
  oxidizer_pump_head: [500000.0, 2500000.0] # Pa
  fuel_pump_head: [500000.0, 2500000.0]     # Pa
  copv_pressure: [15000000.0, 30000000.0]   # Pa
  copv_volume: [0.015, 0.100]               # m^3; fixed diameter/wall from base
  oxidizer_mass: [100.0, 300.0]             # kg
  fuel_mass: [40.0, 150.0]                 # kg; independent of engine MR

# Scale of one unit of violation; these do NOT relax acceptance limits.
constraint_scales:
  max_aoa_deg: 1.0
  goal_apogee: 10000.0
  max_burn_duration: 5.0
  max_q: 10000.0
  min_stability_calibers: 1.0
  min_rail_twr: 0.2
unit_scales:
  deg: 1.0
  m: 0.01
  Pa: 1000000.0
  K: 10.0
  s: 5.0
  kW: 5.0
  calibers: 1.0
  '1': 1.0
