# Vehicle-Sizer sensitivity sweep (SI units: Pa, m^3, kg, K, m, N, etc.).
# Only parameters listed below vary. The source vehicle YAML is NEVER edited.
# Choose values: [..], start/stop/step, or start/stop/num.
# Full field paths work across templates; see sensitivity/README.md for examples.

base_config: Configs/flight_pressure_fed_regulator.yaml

sweep:
  mode: one_at_a_time       # one_at_a_time | full_grid
  max_cases: 10000          # includes standalone baseline
  workers: 6                # 1 = serial, 'auto' = up to 4
  ignore_feasibility: true  # retain margins; bypass design-limit rejections
  ignore_wind: true         # zero wind for each candidate, without editing base YAML

  parameters:
    tanks.press_tank.volume:  # [m^3], 50–120 L in 5 L steps
      start: 0.050
      stop: 0.120
      step: 0.005

    # Other independent-input examples (uncomment ONE for an OAT study):
    # tanks.press_tank.design_pressure:  # [Pa], COPV initial/design pressure
    #   start: 20000000
    #   stop: 35000000
    #   step: 1000000
    # prop_system.Pc_target:             # [Pa], chamber pressure
    #   values: [1000000, 1250000, 1500000]
    # advanced.weld_allowable:           # [Pa], weld allowable stress
    #   values: [100000000, 138000000, 175000000]
    # vehicle.sections[1].masses.counterweight:  # [kg], indexed section mass
    #   values: [0, 5, 10]

outputs:
  record_history: true      # needed for time histories AND true EOL gas states
  history_detail: full      # exports all exposed scalar flight/fluid/control/thermal fields
  compute_loads: false      # true to calculate structural-load extrema
  record_structural_profiles: false  # true WITH compute_loads to save station x time arrays
  directory: outputs/sensitivity/flight_pressure_fed_regulator
