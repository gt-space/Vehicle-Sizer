# ALL VALUES USE THE EXISTING SIZER UNITS (SI)
# Choose values: [v1, v2, ...] OR start/stop/step OR start/stop/num.
# enabled: false -> no sweep for that variable
base_config: Configs/Vespula.yaml

sweep:
  mode: one_at_a_time       # one_at_a_time | full_grid
  max_cases: 10000          # includes the standalone baseline case
  parameters:
    chamber_pressure:      # prop_system.Pc_target [Pa]
      enabled: true
      start: 1800000
      stop: 2200000
      step: 100000

    ox_injector_stiffness:  # prop_system.ox_inj_stiffness [-]
      enabled: false
      values: [0.10, 0.15, 0.20, 0.25]

    fuel_injector_stiffness: # prop_system.fuel_inj_stiffness [-]
      enabled: false
      values: [0.15, 0.20, 0.25, 0.30]

    ox_system_dp:          # prop_system.ox_tank_inj_dp [Pa]
      enabled: false
      values: [150000, 200000, 250000]

    fuel_system_dp:        # prop_system.fuel_tank_inj_dp [Pa]
      enabled: false
      values: [300000, 400000, 500000]

    copv_volume:           # pressurant tank volume [m^3]
      enabled: false
      start: 0.03
      stop: 0.05
      step: 0.005

    copv_pressure:         # pressurant tank design/initial pressure [Pa]
      enabled: false
      values: [25000000, 29000000, 33000000]

    throat_area:           # engine.throat_area [m^2]; choose ONE thrust sizing mode
      enabled: false
      values: [0.003, 0.0035, 0.004, 0.0045]

    target_thrust:         # prop_system.thrust_target [N]; choose ONE thrust sizing mode
      enabled: false
      values: [6000, 8000, 10000, 12000]

    cstar_efficiency:      # engine.cstar_efficiency [-]
      enabled: false
      start: 0.80
      stop: 1.00
      step: 0.05

    cf_efficiency:         # engine.cf_efficiency [-]
      enabled: false
      values: [0.80, 0.85, 0.90, 0.95]

    thrust_tilt:           # engine.thrust_tilt_deg [degrees]
      enabled: false
      start: -1.0
      stop: 1.0
      step: 0.5

    weld_allowable:        # advanced.weld_allowable [Pa], not weld efficiency
      enabled: false
      values: [100000000, 138000000, 170000000]

outputs:
  record_history: true    # required for time-history plots/derivatives + design summary
  compute_loads: false    # enable when structural load peaks are needed
  directory: outputs/sensitivity/vespula
