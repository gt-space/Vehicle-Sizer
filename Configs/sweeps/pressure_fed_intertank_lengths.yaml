# One-at-a-time length increases; explicit hardware masses and stiffness stay fixed.
base_config: Configs/flight_pressure_fed_regulator.yaml
sweep:
  mode: one_at_a_time
  workers: 3
  max_cases: 13
  ignore_wind: false
  parameters:
    IT1_canard_bay:
      path: vehicle.sections[3].length
      offset: true
      values: [0.10, 0.20, 0.30, 0.50]
    IT2_propellant_intertank:
      path: vehicle.sections[5].length
      offset: true
      values: [0.10, 0.20, 0.30, 0.50]
    IT3_engine_bay:
      path: vehicle.sections[7].length
      offset: true
      values: [0.10, 0.20, 0.30, 0.50]
outputs:
  record_history: true
  history_detail: standard
  compute_loads: false
  record_structural_profiles: false
  directory: outputs/sensitivity/pressure_fed_intertank_lengths
