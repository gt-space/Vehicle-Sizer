# SI units; SUNDIALS/IDAS fluid integration. Wiring is selected by prop_system.template.
advanced:
  flight:
    trial_max_retries: 10
    trial_min_dt: 1.0e-06 # s; lower bound for invalid-trial retries
    corrector_max_iterations: 10
    corrector_tolerance: 1.0e-08
    event_max_iterations: 50
    event_time_tolerance: 1.0e-06
  fluid_network:
    jacobian: colored
    max_step: 1.0
    regulator_pressure_tolerance: 0.0
    residual_retries: 2
    residual_tolerance: 1.0e-05
    retry_rtol_factor: 0.1
    retry_rtol_floor: 1.0e-08
    rtol: 0.0001
  heating:
    convergence_tolerance: 0.001
    max_iterations: 20
    temperature_tolerance: 0.01
  t_wall_min: 0.001
  weld_efficiency: 0.5
aero:
  finish: 20um
  fins_on_boattail: true
  model: AeroTables/dragmodel.h5
  nose: vonkarman
avi_bay:
  avi_mass: 11.3
  bulkhead_material: carbon_fiber
  clamshell_material: fiberglass
  clamshell_thickness: 0.003175
  length: 0.25
  ring_material: aluminum_6061
constraints:
  max_aoa_deg: 15.0
  goal_apogee: 150000.0
  max_burn_duration: 75.0
engine:
  cf_efficiency: 0.95
  cstar_efficiency: 0.85
  exit_pressure: 75842.3
  fuel: RP-1
  length: 0.5715
  mass: 20.0
  oxidizer: LOX
environment:
  altitude_step: 100.0
  max_altitude: 150000.0
fin_can:
  hardware_mass: 2.0 # kg; additional fin-can hardware, excluding engine and fins
  boattail_aft_diameter: 0.3032125
  boattail_length: 0.5715
  boattail_wall_thickness: 0.00318
  fin_count: 4
  fin_thickness: 0.009525
  material: carbon_fiber
  root_chord: 0.4445
  span: 0.1905
  sweep_fraction: 0.75
  tip_chord: 0.1524
inter_tank:
  clamshell_material: carbon_fiber
  clamshell_wall_thickness: 0.00318
  stringer_count: 4
  stringer_material: aluminum_7075
launch:
  altitude: 0.0
  rail_height: 15.0
  velocity: 0.0
nosecone:
  wall_thickness: 0.0032 # m; nose shell thickness
  fineness_ratio: 5.0
  material: carbon_fiber
  profile: von_karman
  reco_mass: 5.0
  tip_radius: 0.01
press_tank:
  airframe_material: carbon_fiber
  airframe_wall_thickness: 0.00318
  mount_material: aluminum_7075
  mount_thickness: 0.00318
prop_system:
  MR_target: 2.0
  Pc_target: 1723689.323292
  fuel_inj_pumpout_dp: 275790
  fuel_inj_stiffness: 0.2
  fuel_pumpin_tank_dp: 275790
  nozzle_cd: 1.0
  ox_inj_pumpout_dp: 275790
  ox_inj_stiffness: 0.2
  ox_pumpin_tank_dp: 275790
  pumps:
    fuel_pump:
      curve: &id001
        points:
        - - 0.0
          - 3600000
        - - 1.09
          - 3450000
        - - 1.6
          - 3160000
        - - 2.172
          - 2548600
        - - 2.8
          - 1830000
        - - 3.25
          - 1250000
        - - 4.2
          - 0.0
        reference_mdot: 2.172
      drive: electric
      efficiency: 0.7
      gas_CdA: 0.00015
      max_power_kw: 15.0
      pressure_rise_pa: 1792636.896224
    oxidizer_pump:
      curve: *id001
      drive: electric
      efficiency: 0.7
      gas_CdA: 0.00024
      max_power_kw: 15.0
      pressure_rise_pa: 1792636.896224
  regulator:
    FUEL_REGULATOR:
      capacity_factor: 2.0
      collapse_factor: 1.2
      min_temperature: 220.0
      tank_id: fuel_tank
    OX_REGULATOR:
      capacity_factor: 2.0
      collapse_factor: 1.2
      min_temperature: 220.0
      tank_id: ox_tank
  template: Configs/templates/pump_fed_regulator.yaml
  thrust_target: 14234.309169
  initial_conditions:
    fuel_tank:
      T: 293.0
      fluid: n-Dodecane
      gas_T: 293.0
      gas_fluid: Nitrogen
    ox_tank:
      T: 95.0
      fluid: Oxygen
      gas_T: 293.0
      gas_fluid: Nitrogen
    press_tank:
      T: 300.0
      fluid: Nitrogen
property_models:
  combustion:
    source: table
    table:
      lookup_file: FluidTables/sizer_lookups.h5
      nfz: 1
  pure_fluid:
    source: table
    table:
      fluids:
        Nitrogen:
          pt: nitrogen_pt
          saturation: nitrogen_saturation
        Oxygen: oxygen_pt
        n-Dodecane: ndodecane_pt
      lookup_file: FluidTables/sizer_lookups.h5
simulation:
  dt: 1.0
  fluid_solve_post_shutdown: false
  output: outputs/flight_pump_fed_regulator.csv
  plot: outputs/flight_pump_fed_regulator.png
  t_end: 300.0
