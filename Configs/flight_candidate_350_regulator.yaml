  OMLD: 0.33245320365477454
  dx: 0.01
  sections:
  - type: nosecone
  - type: avi_bay
  - type: press_tank
    tank_id: press_tank
  - type: inter_tank
    mass: 11.3
    length: 0.4
    area_moment_of_inertia: 3.6e-05
  - type: prop_tank
    tank_id: ox_tank
  - type: inter_tank
    mass: 23.6
    length: 0.2
    area_moment_of_inertia: 3.6e-05
  - type: prop_tank
    tank_id: fuel_tank
  - type: inter_tank
    mass: 16.8
    length: 0.7
    area_moment_of_inertia: 3.6e-05
  - type: fin_can
tanks:
  press_tank:
    type: pressurant
    design_pressure: 35659412.529857222
    outer_diameter: 0.25
    wall_thickness: 0.0032
    ellipse_ratio: 1.75
    material: 1018_carbon_steel_standard
    volume: 0.025
  ox_tank:
    type: propellant
    propellant_mass: 190
    ullage_factor: 1.1
    ellipse_ratio: 1.75
    passthrough_diameter: 0.03175
    passthrough_wall_thickness: 0.00254
    material: aluminum_6061_t6
  fuel_tank:
    type: propellant
    propellant_mass: 91
    ullage_factor: 1.1
    ellipse_ratio: 1.75
    passthrough_diameter: 0.1016
    passthrough_wall_thickness: 0.00254
    material: aluminum_6061_t6
nosecone:
  profile: von_karman
  fineness_ratio: 4.464544520231864
  reco_mass: 5.0
  material: carbon_fiber_standard
  tip_radius: 0.01
avi_bay:
  length: 0.25
  avi_mass: 11.3
  clamshell_thickness: 0.003175
  clamshell_material: fiberglass_standard
  bulkhead_material: carbon_fiber_standard
  ring_material: aluminum_6061_t6
press_tank:
  airframe_wall_thickness: 0.00318
  airframe_material: carbon_fiber_standard
